name: Integrity site checks

concurrency:
  group: integrity-site-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "netlify/functions/**"
      - "admin/integrity-office/**"
      - "docs/integrity/**"
      - "projects/hullinger-transmission/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "netlify.toml"
      - ".github/workflows/integrity-site-ci.yml"
  push:
    branches: [main]
    paths:
      - "netlify/functions/**"
      - "admin/integrity-office/**"
      - "docs/integrity/**"
      - "projects/hullinger-transmission/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "netlify.toml"
      - ".github/workflows/integrity-site-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
