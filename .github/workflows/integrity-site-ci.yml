name: Integrity site checks

concurrency:
  group: integrity-site-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "netlify/functions/**"
      - "admin/integrity-office/**"
      - "docs/integrity/**"
      - "projects/hullinger-transmission/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "netlify.toml"
      - ".github/workflows/integrity-site-ci.yml"
  push:
    branches: [main]
    paths:
      - "netlify/functions/**"
      - "admin/integrity-office/**"
      - "docs/integrity/**"
      - "projects/hullinger-transmission/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "netlify.toml"
      - ".github/workflows/integrity-site-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: integrity_office_test
          POSTGRES_USER: integrity_test
          POSTGRES_PASSWORD: integrity_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integrity_test -d integrity_office_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OFFICE_TEST_DATABASE_URL: postgresql://integrity_test:integrity_test_password@127.0.0.1:5432/integrity_office_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --audit=false
      - run: npm test
