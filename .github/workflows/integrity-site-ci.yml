name: Integrity site checks

on:
  pull_request:
    paths:
      - "netlify/functions/**"
      - "projects/hullinger-transmission/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "netlify.toml"
      - ".github/workflows/integrity-site-ci.yml"
  push:
    branches: [main]
    paths:
      - "netlify/functions/**"
      - "projects/hullinger-transmission/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "netlify.toml"
      - ".github/workflows/integrity-site-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
